name: Deploy Website

on:
  release:
    types: [created]
  push:
    branches:
      - master
  pull_request:
    paths:
      - .github/scripts/is-latest-semver-tag.sh
      - .github/scripts/is-latest-semver-tag.test.py
      - scripts/cut-release-branch.sh
      - scripts/cut-release-branch.test.py
      - .github/workflows/deploy-website.yml
      - .github/workflows/release-please.yml
      - .release-please-config.release.json
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: 'Deploy target (production requires an explicit choice; default is test)'
        options:
          - test
          - production
        default: test
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

permissions:
  contents: read

jobs:
  test-release-helpers:
    name: Test release helper scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run is-latest-semver-tag tests
        run: python3 .github/scripts/is-latest-semver-tag.test.py

      - name: Run cut-release-branch tests
        run: python3 scripts/cut-release-branch.test.py

  resolve-targets:
    name: Resolve deploy targets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      skip: ${{ steps.targets.outputs.skip }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      # Needed so release events can compare the new tag against all semver
      # tags and skip production deploys for older maintenance-line patches.
      - name: Checkout repository
        if: github.event_name == 'release'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '' }}
        run: |
          set -euo pipefail
          targets=()
          case "$EVENT" in
            release)
              # Patch releases on older release/X.Y lines must not roll the
              # production site back to that older tree.
              if ./.github/scripts/is-latest-semver-tag.sh "$RELEASE_TAG"; then
                targets+=("production" "test")
              fi
              ;;
            push)
              if [ "$REF" = "refs/heads/master" ]; then
                targets+=("test")
              fi
              ;;
            workflow_dispatch)
              targets+=("$INPUT_TARGET")
              ;;
          esac

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'targets={"target":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          joined=""
          for target in "${targets[@]}"; do
            joined="${joined}\"${target}\","
          done
          echo "targets={\"target\":[${joined%,}]}" >> "$GITHUB_OUTPUT"

  deploy-website:
    name: Deploy ${{ matrix.target }} website
    runs-on: ubuntu-26.04
    needs: resolve-targets
    if: needs.resolve-targets.outputs.skip != 'true'
    concurrency:
      group: deploy-website-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-targets.outputs.targets) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup (detached) tmate session if enabled
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 5
        with:
          detached: true
          limit-access-to-actor: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install docs dependencies
        run: uv sync --frozen --only-group docs --no-install-project

      - name: Build mkdocs site
        run: ./.github/scripts/build-mkdocs-site.sh ${{ matrix.target }}

      - name: Deploy to SFTP server
        uses: ./.github/actions/web-sftp-deploy
        with:
          config_label: ${{ matrix.target == 'production' && 'production website' || 'test website' }}
          ssh_key: ${{ secrets[matrix.target == 'production' && 'WEB_SFTP_SSH_KEY' || 'TEST_WEB_SFTP_SSH_KEY'] }}
          host_key: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_HOST_KEY' || 'TEST_WEB_SFTP_HOST_KEY'] }}
          host: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_HOST' || 'TEST_WEB_SFTP_HOST'] }}
          user: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_USER' || 'TEST_WEB_SFTP_USER'] }}
          path: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_PATH' || 'TEST_WEB_SFTP_PATH'] }}
          port: ${{ matrix.target == 'production' && vars.WEB_SFTP_PORT || '' }}
          source: web/site/
          rsync_exclude: /playground/

      - name: Post-deploy smoke check
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "test" ]; then
            ./.github/scripts/website-deploy-smoke.sh https://test.pythonscad.org/ true
          else
            ./.github/scripts/website-deploy-smoke.sh https://www.pythonscad.org/ false
          fi
