name: Temporary Windows smoke renderer diagnostic

on:
  push:
    branches: [fix/windows-smoke-opengl]
    paths: [.github/workflows/windows-smoke-diagnostic.yml]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test BOM-free pipe encoding with Windows PowerShell
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tests/test_windows_smoke_input.ps1 `
            -PythonExecutable (Get-Command python).Source
          exit $LASTEXITCODE
      - name: Reproduce failure using the existing release package
        id: baseline
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/release-smoke/test-windows.ps1 `
            --repo "$env:GITHUB_REPOSITORY" --run-id 40436244228 `
            --workdir D:/smoke-baseline --keep-workdir
          exit $LASTEXITCODE

      - name: Install the same Mesa used by Windows CI
        uses: ssciwr/setup-mesa-dist-win@v3
        with:
          version: '22.1.7'
          build-type: 'release-mingw'

      - name: Test the same ZIP and NSIS artifacts with Mesa
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/release-smoke/test-windows.ps1 `
            --skip-download --artifact-dir D:/smoke-baseline/artifacts `
            --workdir D:/smoke-mesa --keep-workdir
          exit $LASTEXITCODE

      - name: Print diagnostic logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem D:/smoke-baseline,D:/smoke-mesa -Recurse -Filter '*.log' |
            ForEach-Object {
              Write-Output "Log: $($_.FullName)"
              Get-Content -LiteralPath $_.FullName
            }
