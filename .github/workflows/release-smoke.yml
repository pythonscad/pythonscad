name: Release smoke tests

on:
  workflow_dispatch:
    inputs:
      trigger_release_builds:
        description: 'Trigger fresh release build workflows before smoke testing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  RELEASE_SMOKE_COMMIT: ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release-builds:
    name: Prepare release build artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    outputs:
      appimage: ${{ steps.select.outputs.appimage }}
      debian: ${{ steps.select.outputs.debian }}
      rpm: ${{ steps.select.outputs.rpm }}
      windows: ${{ steps.select.outputs.windows }}
      macos: ${{ steps.select.outputs.macos }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trigger and wait for release build workflows
        if: ${{ inputs.trigger_release_builds }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-smoke/trigger-release-builds.sh \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --commit "$RELEASE_SMOKE_COMMIT" \
            --wait

      - name: Use existing release build artifacts
        if: ${{ !inputs.trigger_release_builds }}
        run: |
          echo "Using release build artifacts for exact commit $RELEASE_SMOKE_COMMIT"

      - name: Pin matching release build runs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/release-smoke/common-smoke.sh
          for entry in appimage:build-appimage.yml debian:build-debian-packages.yml rpm:build-rpm-packages.yml windows:build-windows-native.yml macos:build-macos-release.yml; do
            name=${entry%%:*}
            workflow=${entry#*:}
            run_id=$(rs_latest_successful_run "$GITHUB_REPOSITORY" "$workflow" "$GITHUB_REF_NAME" "$RELEASE_SMOKE_COMMIT")
            echo "$name=$run_id" >> "$GITHUB_OUTPUT"
            echo "$name: run $run_id, commit $RELEASE_SMOKE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          done

  release-smoke:
    name: ${{ matrix.name }}
    needs: prepare-release-builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux smoke tests
            runner: ubuntu-24.04
            timeout_minutes: 120
          - name: macOS smoke tests
            runner: macos-15
            timeout_minutes: 60
          - name: Windows smoke tests
            runner: windows-latest
            timeout_minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Smoke test Linux packages
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_RUN_ID: ${{ needs.prepare-release-builds.outputs.debian }}
          RPM_RUN_ID: ${{ needs.prepare-release-builds.outputs.rpm }}
        run: |
          scripts/release-smoke/test-linux-packages.sh \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --deb-run-id "$DEB_RUN_ID" --rpm-run-id "$RPM_RUN_ID"

      - name: Smoke test macOS DMG
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_RUN_ID: ${{ needs.prepare-release-builds.outputs.macos }}
        run: |
          scripts/release-smoke/test-macos.sh \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" --run-id "$MACOS_RUN_ID"

      - name: Install Mesa for Windows smoke tests
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
        with:
          version: '22.1.7'
          build-type: 'release-mingw'

      - name: Smoke test Windows packages
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ needs.prepare-release-builds.outputs.windows }}
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/release-smoke/test-windows.ps1 `
            --repo "$env:GITHUB_REPOSITORY" `
            --ref "$env:GITHUB_REF_NAME" --run-id "$env:WINDOWS_RUN_ID"

  appimage-smoke:
    name: AppImage smoke tests (Ubuntu ${{ matrix.ubuntu }})
    needs: prepare-release-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04', '26.10']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_RUN_ID: ${{ needs.prepare-release-builds.outputs.appimage }}
        run: |
          source scripts/release-smoke/common-smoke.sh
          rs_validate_run_commit "$GITHUB_REPOSITORY" "$APPIMAGE_RUN_ID" "$RELEASE_SMOKE_COMMIT"
          rs_download_run_artifact "$GITHUB_REPOSITORY" "$APPIMAGE_RUN_ID" \
            pythonscad-qt6-x86_64-appimage "$RUNNER_TEMP/appimage-artifacts"

      - name: Smoke test on Ubuntu
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          # Containers test each userspace/glibc version without depending
          # on native runner availability (in particular Ubuntu 26.10).
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/appimage-artifacts:/artifacts" \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            "ubuntu:$UBUNTU_VERSION" \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 \
                libfontconfig1 libx11-6 libxcb1 libglib2.0-0 \
                libusb-1.0-0 xvfb xauth \
                libgl1-mesa-dri libglx-mesa0 libegl-mesa0
              xvfb-run -a scripts/release-smoke/test-appimages.sh \
                --skip-download --artifact-dir /artifacts
            '
