# Build a representative PyPI wheel on pull requests to catch packaging regressions
# before release. The full multi-platform matrix runs in publish-to-pypi.yml.
name: Build PyPI wheels

on:
  push:
    branches:
      - master
      - release/**
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "pyrightconfig.json"
      - "libraries/python/openscad/**"
      - "libraries/python/pythonscad/**"
      - "libraries/python/stubs/**"
      - "src/python/**"
      - "scripts/cibuildwheel/**"
      - "scripts/smoke-test-pip.py"
      - "scripts/deps/profiles/pythonscad-pip.json"
      - "tests/typing/**"
      - "tests/test_setup_parallel.py"
      - "uv.lock"
      - ".github/workflows/build-pypi-wheels.yml"
  pull_request:
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "pyrightconfig.json"
      - "libraries/python/openscad/**"
      - "libraries/python/pythonscad/**"
      - "libraries/python/stubs/**"
      - "src/python/**"
      - "scripts/cibuildwheel/**"
      - "scripts/smoke-test-pip.py"
      - "scripts/deps/profiles/pythonscad-pip.json"
      - "tests/typing/**"
      - "tests/test_setup_parallel.py"
      - "uv.lock"
      - ".github/workflows/build-pypi-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel-smoke:
    name: cp312 manylinux x86_64 wheel + smoke test
    runs-on: ubuntu-26.04
    env:
      CIBW_BUILD: cp312-manylinux_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Fetch tags for version detection
        run: |
          git fetch --unshallow --tags || git fetch --tags
          git describe --tags --always --dirty

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install build tooling
        run: uv sync --frozen --only-group build --only-group typing --no-install-project

      - name: Type-check the public Python API
        run: uv run --no-sync pyright --project tests/typing

      - name: Run setup.py parallel-compile unit tests
        # setuptools is a build-system requirement, not a project dep; pull it
        # in with pytest so `from setuptools import Distribution` resolves.
        # Use `python -m pytest` so the repo root stays on sys.path and
        # `from setup import ...` resolves (bare `pytest` does not).
        run: uv run --no-sync --with pytest --with setuptools python -m pytest -q tests/test_setup_parallel.py

      - name: Add build tools to PATH
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Build wheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheel-smoke
          path: wheelhouse/*.whl

  build-windows-wheel-smoke:
    name: cp312 win_amd64 wheel smoke
    runs-on: windows-2025
    env:
      CIBW_BUILD: cp312-win_amd64
    steps:
      - run: |
          git config --global submodule.fetchJobs 8
          git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Fetch tags for version detection
        run: |
          git fetch --unshallow --tags || git fetch --tags
          git describe --tags --always --dirty

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install build tooling
        run: uv sync --frozen --only-group build --no-install-project

      - name: Add build tools to PATH
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "$GITHUB_PATH"

      - name: Setup MSYS2 parser tools
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: MSYS
          update: false
          install: >-
            flex
            bison

      - name: Add MSYS2 parser tools to PATH
        shell: bash
        run: echo "C:/msys64/usr/bin" >> "$GITHUB_PATH"

      - name: Restore Windows vcpkg cache
        id: windows-vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .wheel-vcpkg
            .wheel-vcpkg-cache
            ~/AppData/Local/vcpkg/archives
          key: pypi-windows-vcpkg-${{ hashFiles('scripts/cibuildwheel/vcpkg.json', 'scripts/cibuildwheel/install-deps-windows.ps1') }}
          restore-keys: |
            pypi-windows-vcpkg-

      - name: Install Windows wheel dependencies
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.wheel-vcpkg-cache,readwrite
        run: ./scripts/cibuildwheel/install-deps-windows.ps1

      - name: Prune Windows vcpkg cache
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            ".wheel-vcpkg\buildtrees",
            ".wheel-vcpkg\downloads",
            ".wheel-vcpkg\packages"
          )) {
            if (Test-Path $path) {
              Remove-Item -Recurse -Force $path
            }
          }

      - name: Save Windows vcpkg cache
        if: steps.windows-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .wheel-vcpkg
            .wheel-vcpkg-cache
            ~/AppData/Local/vcpkg/archives
          key: ${{ steps.windows-vcpkg-cache.outputs.cache-primary-key }}

      - name: Build wheel
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BEFORE_ALL_WINDOWS: python -c "print('Windows wheel dependencies already installed by workflow')"

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-windows-wheel-smoke
          path: wheelhouse/*.whl
