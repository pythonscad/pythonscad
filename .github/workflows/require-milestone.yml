name: Require Milestone

on:
  # Use pull_request_target so the workflow file always comes from the
  # base branch. A PR that edits this file cannot weaken the gate.
  # Safe here: no checkout of PR code; only reads milestone fields via API.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened, synchronize, milestoned, demilestoned]
  # Revalidate open PRs when a milestone is closed, renamed, or deleted
  # (those changes do not emit per-PR milestoned/demilestoned events).
  milestone:
    types: [closed, edited, opened, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  # Key by PR when possible so a milestone revalidation and a PR event
  # for the same PR cancel each other. Milestone-only runs still key by
  # milestone number; the PR path always re-fetches live state so a
  # leftover PR run cannot republish a stale green check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.milestone.number || github.ref }}
  cancel-in-progress: true

jobs:
  require-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR milestone
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # pull_request_target associates the workflow job check with the
          # base SHA; post an explicit check against the PR head so a
          # required "require-milestone" status can gate the merge.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          conclusion="success"
          reason=""
          summary=""

          # Always re-fetch live milestone state. The event payload can be
          # stale if a concurrent milestone closed/edited run already ran,
          # and a late PR-event completion must not republish a green check.
          if ! MILESTONE_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq 'if .milestone == null then empty else {title: .milestone.title, state: .milestone.state} end'); then
            conclusion="failure"
            reason="Failed to fetch PR #${PR_NUMBER} milestone state."
            summary="${reason}"
          elif [ -z "${MILESTONE_JSON}" ]; then
            conclusion="failure"
            reason="PR must be assigned to a milestone before merge."
            summary="${reason}"
          else
            MILESTONE_TITLE=$(echo "${MILESTONE_JSON}" | jq -r .title)
            MILESTONE_STATE=$(echo "${MILESTONE_JSON}" | jq -r .state)

            if [ "${MILESTONE_STATE}" != "open" ]; then
              conclusion="failure"
              reason="Milestone '${MILESTONE_TITLE}' is closed; use an open milestone."
              summary="${reason}"
            # Intentionally unanchored at the start so names like
            # "Prominentio v1.1.0" match as well as bare "v1.1.0".
            elif ! [[ "${MILESTONE_TITLE}" =~ v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              conclusion="failure"
              reason="Milestone '${MILESTONE_TITLE}' must end with a version like v1.0 or v1.0.0 (pattern: v[0-9]+\\.[0-9]+(\\.[0-9]+)?\$)."
              summary="${reason}"
            else
              summary="OK: open milestone '${MILESTONE_TITLE}'"
            fi
          fi

          if ! gh api "repos/${REPO}/check-runs" \
            -f name='require-milestone' \
            -f head_sha="${HEAD_SHA}" \
            -f status='completed' \
            -f conclusion="${conclusion}" \
            -f 'output[title]=Require Milestone' \
            -f "output[summary]=${summary}" \
            >/dev/null; then
            echo "::error::Failed to post require-milestone check for PR #${PR_NUMBER} (${HEAD_SHA})."
            exit 1
          fi

          if [ "${conclusion}" = "failure" ]; then
            echo "::error::${reason}"
            exit 1
          fi

          echo "${summary}"

      - name: Revalidate open PRs for changed milestone
        if: github.event_name == 'milestone'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MILESTONE_ACTION: ${{ github.event.action }}
          MILESTONE_NUMBER: ${{ github.event.milestone.number }}
          MILESTONE_TITLE: ${{ github.event.milestone.title }}
          MILESTONE_STATE: ${{ github.event.milestone.state }}
        run: |
          set -euo pipefail

          reason=""
          conclusion="success"
          summary="OK: open milestone '${MILESTONE_TITLE}'"

          if [ "${MILESTONE_ACTION}" = "deleted" ]; then
            conclusion="failure"
            reason="Milestone '${MILESTONE_TITLE}' was deleted; assign an open versioned milestone."
            summary="${reason}"
          elif [ "${MILESTONE_STATE}" != "open" ]; then
            conclusion="failure"
            reason="Milestone '${MILESTONE_TITLE}' is closed; use an open milestone."
            summary="${reason}"
          elif ! [[ "${MILESTONE_TITLE}" =~ v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            conclusion="failure"
            reason="Milestone '${MILESTONE_TITLE}' must end with a version like v1.0 or v1.0.0."
            summary="${reason}"
          fi

          # After deletion the milestone number no longer lists former
          # assignees, so fall back to open PRs that currently have no
          # milestone (the set that lost their assignment).
          if [ "${MILESTONE_ACTION}" = "deleted" ]; then
            if ! PR_NUMBERS=$(gh api --paginate \
              "repos/${REPO}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.milestone == null) | .number'); then
              echo "::error::Failed to list open PRs after milestone deletion."
              exit 1
            fi
          else
            # Paginate fully via the Issues API (includes PRs). Capture exit
            # status explicitly — process substitution would hide gh failures
            # under set -e and incorrectly treat errors as "no PRs".
            if ! PR_NUMBERS=$(gh api --paginate \
              "repos/${REPO}/issues?milestone=${MILESTONE_NUMBER}&state=open&per_page=100" \
              --jq '.[] | select(.pull_request != null) | .number'); then
              echo "::error::Failed to list open PRs for milestone #${MILESTONE_NUMBER}."
              exit 1
            fi
          fi

          if [ -z "${PR_NUMBERS}" ]; then
            if [ "${MILESTONE_ACTION}" = "deleted" ]; then
              echo "No open PRs without a milestone after deleting '${MILESTONE_TITLE}'."
            else
              echo "No open PRs assigned to milestone #${MILESTONE_NUMBER}."
            fi
            exit 0
          fi

          failed=0
          count=0
          while IFS= read -r pr_number; do
            [ -z "${pr_number}" ] && continue
            count=$((count + 1))

            if ! head_sha=$(gh api "repos/${REPO}/pulls/${pr_number}" --jq .head.sha); then
              echo "::error::Failed to fetch head SHA for PR #${pr_number}."
              failed=1
              continue
            fi

            echo "Updating require-milestone check on PR #${pr_number} (${head_sha}) → ${conclusion}"

            # Post a check run with the same name as this job so a required
            # "require-milestone" status reflects the current milestone state.
            # Continue on per-PR failures so every affected PR is attempted.
            if ! gh api "repos/${REPO}/check-runs" \
              -f name='require-milestone' \
              -f head_sha="${head_sha}" \
              -f status='completed' \
              -f conclusion="${conclusion}" \
              -f 'output[title]=Require Milestone' \
              -f "output[summary]=${summary}" \
              >/dev/null; then
              echo "::error::Failed to post require-milestone check for PR #${pr_number}."
              failed=1
              continue
            fi

            if [ "${conclusion}" = "failure" ]; then
              failed=1
              echo "::warning::PR #${pr_number}: ${reason}"
            fi
          done <<< "${PR_NUMBERS}"

          if [ "${failed}" -ne 0 ]; then
            echo "::error::${reason:-One or more PR check updates failed.}"
            exit 1
          fi

          echo "Revalidated ${count} open PR(s) against open milestone '${MILESTONE_TITLE}'."
