name: Build WebAssembly

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Release tag to upload artifacts to (leave empty for CI-only build)'
        required: false
        default: ''
      deploy_target:
        type: choice
        description: 'Playground deploy target (production requires explicit choice; default is test)'
        options:
          - test
          - production
        default: test
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false
      wasm_artifact_retention_days:
        type: number
        description: 'Retention in days for WASM handoff artifacts (1-90)'
        required: false
        default: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-toolchain:
    name: Ensure published WASM toolchain
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/publish-wasm-toolchain.yml
    permissions:
      contents: read
      packages: write

  build-test:
    name: Build and test WebAssembly
    runs-on: ubuntu-latest
    needs: publish-toolchain
    if: >
      always() &&
      (needs.publish-toolchain.result == 'success' ||
       needs.publish-toolchain.result == 'skipped')
    # Keep least-privilege here: this job builds and executes untrusted
    # contributor code on pull_request runs, so it must never hold a
    # write-capable token. Release upload happens in the separate
    # upload-release job below.
    permissions:
      contents: read
    outputs:
      wasm_zip: ${{ steps.package.outputs.wasm_zip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Test playground deploy smoke check
        run: python3 wasm-test/wasm-playground-deploy-smoke.test.py

      - name: Fetch tags for version detection
        run: |
          git fetch --unshallow --tags || git fetch --tags
          git describe --tags --always --dirty

      - name: Setup tmate session (debug)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 5
        with:
          detached: true
          limit-access-to-actor: true

      - name: Validate artifact retention
        id: retention
        env:
          REQUESTED_RETENTION_DAYS: ${{ github.event.inputs.wasm_artifact_retention_days || '1' }}
        run: |
          case "$REQUESTED_RETENTION_DAYS" in
            ''|*[!0-9]*)
              echo "WASM artifact retention must be an integer number of days." >&2
              exit 1
              ;;
          esac
          if [ "$REQUESTED_RETENTION_DAYS" -lt 1 ] || [ "$REQUESTED_RETENTION_DAYS" -gt 90 ]; then
            echo "WASM artifact retention must be between 1 and 90 days." >&2
            exit 1
          fi
          echo "days=$REQUESTED_RETENTION_DAYS" >> "$GITHUB_OUTPUT"

      - name: Resolve WASM toolchain image
        id: toolchain
        uses: ./.github/actions/build-wasm-toolchain
        with:
          push: 'false'
          load: 'true'
          reclaim-space: 'true'

      - name: Build WASM node variant
        run: |
          docker run --rm -i \
            -v "$PWD:/src:rw" \
            -w /src \
            pythonscad-wasm-python-base:local \
            bash -c "
              set -euo pipefail
              emcmake cmake -B build-wasm-node \
                -DWASM_BUILD_TYPE=node \
                -DCMAKE_BUILD_TYPE=Release \
                -DEXPERIMENTAL=1 \
                -Wno-dev 2>&1 | tail -10
              cmake --build build-wasm-node -j\$(nproc) 2>&1 | tail -5
            "

      - name: Smoke test (node)
        run: |
          docker run --rm -i \
            -v "$PWD:/src:rw" \
            -v "$PWD/libraries/python:/cpython-wasm/lib/pythonscad/libraries/python:ro" \
            -w /src/build-wasm-node \
            pythonscad-wasm-python-base:local \
            bash -c "
              printf 'from openscad import *\nshow(difference(cube([20,20,20], center=True), cylinder(h=25, r=5, center=True)))\n' > /tmp/test.py
              node pythonscad.js -o /tmp/out.stl --python=native /tmp/test.py
              SIZE=\$(wc -c < /tmp/out.stl)
              echo \"STL output: \${SIZE} bytes\"
              [ \"\${SIZE}\" -gt 1000 ] || { echo 'FAIL: STL too small or missing'; exit 1; }
              echo 'PASS'
            "

      - name: Smoke test Python callback ABI
        run: |
          docker run --rm -i \
            -v "$PWD:/src:rw" \
            -v "$PWD/libraries/python:/cpython-wasm/lib/pythonscad/libraries/python:ro" \
            -w /src/build-wasm-node \
            pythonscad-wasm-python-base:local \
            bash -c "
              set -euo pipefail
              node pythonscad.js -o /tmp/add-parameter.stl --python=native \
                /src/wasm-test/python-callback-abi.py
              SIZE=\$(wc -c < /tmp/add-parameter.stl)
              echo \"add_parameter STL output: \${SIZE} bytes\"
              [ \"\${SIZE}\" -gt 1000 ] || { echo 'FAIL: STL too small or missing'; exit 1; }
              echo 'PASS'
            "

      - name: Smoke test Minkowski logo
        run: |
          docker run --rm -i \
            -v "$PWD:/src:rw" \
            -v "$PWD/libraries/python:/cpython-wasm/lib/pythonscad/libraries/python:ro" \
            -w /src/build-wasm-node \
            pythonscad-wasm-python-base:local \
            bash -c "
              set -euo pipefail
              node pythonscad.js -o /tmp/logo.stl --python=native \
                /src/examples/Python/pythonscad-logo.py 2>&1 | tee /tmp/logo.log
              ! grep -q 'assertion violation' /tmp/logo.log
              SIZE=\$(wc -c < /tmp/logo.stl)
              echo \"Logo STL output: \${SIZE} bytes\"
              [ \"\${SIZE}\" -gt 1000 ] || { echo 'FAIL: logo STL too small or missing'; exit 1; }
              echo 'PASS'
            "

      - name: Test notebook worker protocol
        run: |
          node --test wasm-test/notebook-geometry.test.mjs
          node --test wasm-test/notebook-protocol.test.mjs

      - name: Build WASM web variant
        run: |
          docker run --rm -i \
            -v "$PWD:/src:rw" \
            -w /src \
            pythonscad-wasm-python-base:local \
            bash -c "
              set -euo pipefail
              emcmake cmake -B build-wasm-web \
                -DWASM_BUILD_TYPE=web \
                -DCMAKE_BUILD_TYPE=Release \
                -DEXPERIMENTAL=1 \
                -Wno-dev 2>&1 | tail -10
              cmake --build build-wasm-web -j\$(nproc) 2>&1 | tail -5
            "

      - name: Package web artifacts
        id: package
        run: |
          VERSION=$(git describe --tags --always)
          mkdir -p dist-wasm/wasm-test dist-wasm/vendor
          cp build-wasm-web/pythonscad.js \
             build-wasm-web/pythonscad.wasm \
             build-wasm-web/pythonscad.data \
             wasm-test/test.html \
             wasm-test/notebook.html \
             wasm-test/notebook-geometry.mjs \
             wasm-test/notebook-protocol.mjs \
             wasm-test/notebook-kernel.mjs \
             wasm-test/notebook-worker.mjs \
             dist-wasm/
          cp wasm-test/vendor/three.module.min.js \
             wasm-test/vendor/three.core.min.js \
             dist-wasm/vendor/
          cp wasm-test/serve.py dist-wasm/wasm-test/
          cd dist-wasm
          zip -r "../pythonscad-${VERSION}-wasm.zip" .
          echo "wasm_zip=pythonscad-${VERSION}-wasm.zip" >> "$GITHUB_OUTPUT"

      - name: Upload WASM browser bundle
        uses: actions/upload-artifact@v7
        with:
          name: pythonscad-wasm-web
          path: dist-wasm/
          if-no-files-found: error
          retention-days: ${{ steps.retention.outputs.days }}

      - name: Upload WASM release zip
        uses: actions/upload-artifact@v7
        with:
          name: pythonscad-wasm-release-zip
          path: ${{ steps.package.outputs.wasm_zip }}
          if-no-files-found: error
          retention-days: ${{ steps.retention.outputs.days }}

  upload-release:
    name: Upload WASM bundle to release
    runs-on: ubuntu-latest
    needs: build-test
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_release != '')
    # The write-capable token only lives in this job, which never runs on
    # pull_request events and does not build or execute repository code.
    permissions:
      contents: write  # for release asset upload

    steps:
      - name: Download WASM release zip
        uses: actions/download-artifact@v8
        with:
          name: pythonscad-wasm-release-zip

      - name: Upload WASM artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.upload_to_release }}
          GH_REPO: ${{ github.repository }}
          WASM_ZIP: ${{ needs.build-test.outputs.wasm_zip }}
        run: |
          gh release upload "$RELEASE_TAG" "$WASM_ZIP" \
            -R "$GH_REPO" --clobber

  resolve-playground-targets:
    name: Resolve playground deploy targets
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.targets.outputs.skip }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'targets={"target":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          targets=()
          case "$EVENT" in
            release)
              targets+=("production" "test")
              ;;
            push)
              if [ "$REF" = "refs/heads/master" ]; then
                targets+=("test")
              fi
              ;;
            workflow_dispatch)
              targets+=("$INPUT_TARGET")
              ;;
          esac

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'targets={"target":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          joined=""
          for target in "${targets[@]}"; do
            joined="${joined}\"${target}\","
          done
          echo "targets={\"target\":[${joined%,}]}" >> "$GITHUB_OUTPUT"

  deploy-playground:
    name: Deploy ${{ matrix.target }} playground
    runs-on: ubuntu-latest
    needs: [build-test, resolve-playground-targets]
    if: >
      always() &&
      needs.resolve-playground-targets.outputs.skip != 'true' &&
      needs.build-test.result == 'success'
    concurrency:
      group: wasm-playground-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-playground-targets.outputs.targets) }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download WASM web bundle
        uses: actions/download-artifact@v8
        with:
          name: pythonscad-wasm-web
          path: wasm-bundle

      - name: Assemble playground directory
        run: ./.github/scripts/assemble-playground.sh wasm-bundle

      - name: Validate playground artifacts
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ./.github/scripts/web-deploy-common.sh
          validate_playground_dir playground

      - name: Deploy playground to SFTP server
        uses: ./.github/actions/web-sftp-deploy
        with:
          config_label: ${{ matrix.target == 'production' && 'production playground' || 'test playground' }}
          ssh_key: ${{ secrets[matrix.target == 'production' && 'WEB_SFTP_SSH_KEY' || 'TEST_WEB_SFTP_SSH_KEY'] }}
          host_key: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_HOST_KEY' || 'TEST_WEB_SFTP_HOST_KEY'] }}
          host: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_HOST' || 'TEST_WEB_SFTP_HOST'] }}
          user: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_USER' || 'TEST_WEB_SFTP_USER'] }}
          path: ${{ vars[matrix.target == 'production' && 'WEB_SFTP_PATH' || 'TEST_WEB_SFTP_PATH'] }}
          port: ${{ matrix.target == 'production' && vars.WEB_SFTP_PORT || '' }}
          source: playground/
          remote_subpath: playground/

      - name: Post-deploy smoke check
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "test" ]; then
            ./.github/scripts/wasm-playground-deploy-smoke.sh https://test.pythonscad.org/
          else
            ./.github/scripts/wasm-playground-deploy-smoke.sh https://www.pythonscad.org/
          fi
